name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - name: Fix minSdk
        run: |
          echo "flutter.minSdkVersion=24" >> android/local.properties
          sed -i 's/minSdkVersion.*/minSdkVersion 24/' android/app/build.gradle || true
          sed -i 's/minSdk .*/minSdk 24/' android/app/build.gradle.kts || true
          sed -i 's/flutter.minSdkVersion.*/flutter.minSdkVersion=24/' android/local.properties || true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
